<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mobiliando com IA - Engenharia de Prompts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <style>
    :root{
      --bg: #050a08;
      --glass: rgba(23, 23, 23, 0.72);
      --glass2: rgba(0, 0, 0, 0.65);
      --stroke: rgba(255,255,255,0.10);
      --stroke2: rgba(255,255,255,0.06);
      --text: rgba(255,255,255,0.92);
      --accent: #FFD92A;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin:0;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .topbar{
      position: fixed; top:0; left:0; right:0; height: 64px; z-index: 50;
      display:flex; align-items:center; justify-content:space-between; padding: 0 24px;
      background: rgba(10, 14, 13, 0.6); backdrop-filter: blur(20px); border-bottom: 1px solid var(--stroke2);
    }
    .brand{ display:flex; align-items:center; gap: 12px; font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }
    .brandDot{ width: 10px; height: 10px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 15px rgba(255,217,42,0.5); }
    .topActions{ display:flex; gap: 10px; }
    .topBtn{
      height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05); color: var(--text); cursor:pointer; font-size: 13px; font-weight: 500;
      transition: background 0.2s, border-color 0.2s;
    }
    .topBtn:hover{ background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.15); }

    .main{ position: absolute; top: 64px; left:0; right:0; bottom:0; display: flex; align-items: center; justify-content: center; flex-direction: column; opacity: 0.15; }
    .main i { font-size: 5rem; color: var(--accent); }

    .dockRoot{ position: fixed; left:0; right:0; bottom: 24px; z-index: 100; display:flex; justify-content:center; pointer-events:none; padding: 0 24px; }
    .dockRoot > *{ pointer-events: auto; }

    .dock{
      position: relative; width: min(920px, 100%); border-radius: 36px; padding: 20px 24px;
      background: var(--glass); backdrop-filter: blur(30px);
      box-shadow: rgba(255,255,255,0.1) 0px 1px 1px 0px inset, rgba(0,0,0,0.6) 0 30px 60px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .dockTop{ display:flex; justify-content: space-between; align-items:center; gap: 16px;}
    .dockLeft, .dockRight{ display:flex; align-items:center; gap: 12px; }

    .iconBtn{
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; transition: all 0.2s;
    }
    .iconBtn:hover{ background: rgba(255,255,255,0.15); }

    .pillMuted{
      height: 40px; padding: 0 16px; border-radius: 999px; background: rgba(0,0,0,0.3);
      display:flex; align-items:center; gap: 10px; color: rgba(255,255,255,0.7); font-size: 13px;
    }

    .tBtn.active{ color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

    .ctaBtn{
      height: 48px; padding: 0 28px; border-radius: 999px; border:none;
      background: var(--accent); color: #000; font-size: 15px; font-weight: 800; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap: 10px; box-shadow: 0 8px 20px rgba(255,217,42,0.3);
    }
    .ctaBtn:disabled{ opacity: 0.3; cursor: not-allowed; box-shadow:none; }

    .dockBody{ padding: 18px 0; }
    .prompt{
      width: 100%; min-height: 50px; background: transparent; border: none; outline: none; resize: none;
      color: #fff; font-size: 16px; font-family: inherit;
    }

    .dockBottom{
      display:flex; gap: 12px; align-items:center; justify-content:flex-start;
      border-top: 1px solid rgba(255,255,255,0.06); padding-top: 16px;
    }

    .popWrap{ position: relative; }
    .chip{
      height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
      color: #fff; cursor:pointer; font-size: 13px; display:flex; align-items:center; gap:8px; transition: all 0.2s;
    }
    .chip:hover{ background: rgba(255,255,255,0.1); }

    .pop{
      position:absolute; left: 0; bottom: calc(100% + 16px); min-width: 280px; border-radius: 24px;
      backdrop-filter: blur(30px); background: var(--glass2); border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4); z-index: 999; display: none;
    }
    .pop.show{ display: block; }
    .popSec{ padding: 20px; display:flex; flex-direction:column; gap: 14px; }
    .popTitle{ font-weight: 800; font-size: 12px; color: rgba(255,255,255,0.4); text-transform: uppercase; }

    .grid3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .tile{
      height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #fff; cursor:pointer; font-size: 13px;
    }
    .tile.active{ background: #fff; color: #000; font-weight: 700; }

    .listItem{ text-align:left; padding: 12px 16px; border-radius: 12px; border: none; background: transparent; color: #fff; cursor:pointer; width: 100%; }
    .listItem.active{ background: rgba(255,255,255,0.1); font-weight: 700; }

    .toast{
      position: fixed; left: 50%; top: 84px; transform: translate(-50%, -10px); z-index: 200; padding: 14px 20px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); color: #fff; font-size: 14px; font-weight: 500;
      display:flex; gap: 12px; align-items:center; opacity: 0; pointer-events: none; transition: all 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .toast.show{ opacity: 1; transform: translate(-50%, 0); }

    .overlay{
      position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px);
      display:none; align-items:center; justify-content:center; padding: 20px;
    }
    .overlay.show{ display:flex; }
    .modal{ width: min(700px, 100%); border-radius: 28px; background: rgba(18, 22, 20, 0.95); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.12); overflow:hidden; }
    .modalHead{ display:flex; align-items:center; justify-content:space-between; padding: 24px 30px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .closeBtn{ background: none; border: none; color: #fff; cursor: pointer; }
    .modalBody{ padding: 30px; max-height: 70vh; overflow-y: auto; }
    
    .panel{ border-radius: 20px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); padding: 24px; margin-bottom: 20px; }
    .label{ font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 700; text-transform: uppercase; margin-bottom: 12px;}

    input[type="password"]{ width: 100%; height: 48px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); background: #000; color:#fff; padding: 0 16px; outline:none; margin-bottom: 12px; }

    .uploadGrid{ display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .slot{ border: 2px dashed rgba(255,255,255,0.15); border-radius: 20px; padding: 20px; min-height: 220px; display: flex; flex-direction: column; cursor: pointer; }
    .preview{ flex: 1; border-radius: 14px; background: rgba(0,0,0,0.4); background-size: cover; background-position: center; margin: 10px 0; }
    
    pre{ background: #000; padding: 20px; border-radius: 16px; color: #fff; font-family: monospace; white-space: pre-wrap; font-size: 14px; line-height: 1.6; }

    @media (max-width: 600px){ .dock{ width: 100%; border-radius: 32px 32px 0 0; } .uploadGrid{ grid-template-columns: 1fr; } }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand"><span class="brandDot"></span> Mobiliando com IA</div>
    <div class="topActions">
      <button class="topBtn" id="btnConfig">Configurações</button>
      <button class="topBtn" id="btnHelp">Ajuda</button>
    </div>
  </header>

  <div class="toast" id="toast"></div>

  <main class="main">
    <i class="fa-solid fa-wand-magic-sparkles"></i>
  </main>

  <div class="dockRoot">
    <div class="dock" id="dock">
      <div class="dockTop">
        <div class="dockLeft">
          <button class="iconBtn" id="btnUploads"><i class="fa-solid fa-image"></i></button>
          <div class="pillMuted" id="statusText">Aguardando Foto...</div>
        </div>
        <div class="dockRight">
          <button class="iconBtn tBtn active" id="btnAuto"><i class="fa-solid fa-magic"></i></button>
          <button class="ctaBtn" id="btnRun" disabled>Gerar Prompt <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>
      <div class="dockBody">
        <textarea class="prompt" id="userPrompt" rows="2" placeholder="Ex: Adicionar sofá de linho..."></textarea>
      </div>
      <div class="dockBottom">
        <div class="popWrap">
          <button class="chip popTrigger" data-pop="popFormat">Formato: <span id="formatLabel">16:9</span></button>
          <div class="pop" id="popFormat">
            <div class="popSec">
              <div class="popTitle">Aspect Ratio</div>
              <div class="grid3">
                <button class="tile active" data-format="16:9">16:9</button>
                <button class="tile" data-format="9:16">9:16</button>
                <button class="tile" data-format="4:3">4:3</button>
              </div>
            </div>
          </div>
        </div>
        <div class="popWrap">
          <button class="chip popTrigger" data-pop="popStyle">Estilo: <span id="styleLabel">AUTO</span></button>
          <div class="pop" id="popStyle">
            <div class="popSec">
              <div class="popTitle">Estilo</div>
              <button class="listItem active" data-style="AUTO">Decisão da IA</button>
              <button class="listItem" data-style="E01">Minimalista Quente</button>
              <button class="listItem" data-style="E02">Contemporâneo Neutro</button>
              <button class="listItem" data-style="E03">Escandinavo Natural</button>
              <button class="listItem" data-style="E04">Urbano Industrial</button>
              <button class="listItem" data-style="E05">Mediterrâneo</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="ovConfig">
    <div class="modal">
      <div class="modalHead">
        <b>Configurações</b>
        <button class="closeBtn closeConfigBtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 1L1 13M1 1L13 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="modalBody">
        <div class="panel">
          <div class="label">Google Gemini API Key</div>
          <input type="password" id="apiKey" placeholder="Cole sua chave aqui...">
          <button class="btnAccent" style="width:100%; height:44px; border-radius:12px; border:none; cursor:pointer;" id="saveKey">Guardar Chave</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="ovHelp">
    <div class="modal">
      <div class="modalHead">
        <b>Ajuda</b>
        <button class="closeBtn closeHelpBtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 1L1 13M1 1L13 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="modalBody">
        <div class="panel">
          <p>O aplicativo lê a arquitetura da sua sala e cria o texto exato para usar em geradores de imagem.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="ovUploads">
    <div class="modal">
      <div class="modalHead">
        <b>Imagens do Ambiente</b>
        <button class="closeBtn closeUploadsBtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 1L1 13M1 1L13 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="modalBody">
        <div class="uploadGrid">
          <div class="slot" id="slotBase">
            <b>1. Foto Base</b>
            <div class="preview" id="prevBase"></div>
            <button class="miniBtn" id="rmBase" style="border:none; background:none; color:red; cursor:pointer;">Limpar</button>
            <input type="file" id="fileBase" accept="image/*" hidden>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="ovPrompt">
    <div class="modal">
      <div class="modalHead">
        <b>Prompt de Staging Gerado</b>
        <button class="closeBtn closePromptBtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 1L1 13M1 1L13 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="modalBody">
        <pre id="promptResult"></pre>
        <button class="ctaBtn" style="width:100%; margin-top:20px;" id="copyBtn">Copiar Prompt</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // SEU LINK JÁ INJETADO AQUI! (O mesmo da versão 10, que atualizou pra 11)
    // =========================================================================
    const COFRE_URL = "https://script.google.com/macros/s/AKfycbyJlE1l1N6nueqoqy1vZCyVdVNEB_74IsCz-vOOY_G-4JDwMlq3OReQvVAjHNBjTWY/exec";
    
    const state = { format: "16:9", style: "AUTO", autoPrompt: true, base: null };
    const $ = id => document.getElementById(id);

    function openModal(id) { $(id).classList.add('show'); }
    function closeModal(id) { $(id).classList.remove('show'); }

    document.querySelectorAll('.popTrigger').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const popId = btn.dataset.pop;
        const wasShown = $(popId).classList.contains('show');
        document.querySelectorAll('.pop').forEach(p => p.classList.remove('show'));
        if(!wasShown) $(popId).classList.add('show');
      }
    });
    document.onclick = () => document.querySelectorAll('.pop').forEach(p => p.classList.remove('show'));

    $('btnConfig').onclick = () => openModal('ovConfig');
    $('btnHelp').onclick = () => openModal('ovHelp');
    
    $('saveKey').onclick = () => {
      localStorage.setItem('afrodite_key', $('apiKey').value);
      alert('Chave guardada!');
      updateRun();
    };

    $('btnUploads').onclick = () => openModal('ovUploads');
    $('slotBase').onclick = () => $('fileBase').click();

    async function processImg(file, size) {
      return new Promise(res => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scale = Math.min(size / img.width, size / img.height, 1);
            canvas.width = img.width * scale; canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            res(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    $('fileBase').onchange = async e => {
      state.base = await processImg(e.target.files[0], 1000); 
      $('prevBase').style.backgroundImage = `url(${state.base})`;
      updateRun();
    };

    $('rmBase').onclick = (e) => {
      e.stopPropagation();
      state.base = null;
      $('prevBase').style.backgroundImage = 'none';
      $('fileBase').value = '';
      updateRun();
    };

    $('btnAuto').onclick = () => {
      state.autoPrompt = !state.autoPrompt;
      $('btnAuto').classList.toggle('active');
    };

    document.querySelectorAll('[data-format]').forEach(b => b.onclick = () => {
        state.format = b.dataset.format; $('formatLabel').innerText = state.format;
        document.querySelectorAll('[data-format]').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
    });

    document.querySelectorAll('[data-style]').forEach(b => b.onclick = () => {
        state.style = b.dataset.style; $('styleLabel').innerText = state.style;
        document.querySelectorAll('[data-style]').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
    });

    // Fechar X dos modais
    document.querySelectorAll('.closeConfigBtn').forEach(btn => btn.onclick = () => closeModal('ovConfig'));
    document.querySelectorAll('.closeHelpBtn').forEach(btn => btn.onclick = () => closeModal('ovHelp'));
    document.querySelectorAll('.closeUploadsBtn').forEach(btn => btn.onclick = () => closeModal('ovUploads'));
    document.querySelectorAll('.closePromptBtn').forEach(btn => btn.onclick = () => closeModal('ovPrompt'));

    function updateRun() {
      const key = localStorage.getItem('afrodite_key');
      const canRun = state.base && key && COFRE_URL.includes("script.google.com");
      $('btnRun').disabled = !canRun;
      
      if (!key) {
        $('statusText').innerText = "Insira a Chave API";
      } else if (!state.base) {
        $('statusText').innerText = "Anexe a foto da sala";
      } else {
        $('statusText').innerText = "Pronto para Ler a Imagem";
      }
    }

    // A MUDANÇA ESTÁ AQUI: RASTREIO DEFINITIVO DO ERRO
    $('btnRun').onclick = async () => {
      $('btnRun').disabled = true;
      $('statusText').innerText = "A conversar com o Google...";
      
      const payload = {
        key: localStorage.getItem('afrodite_key'),
        configs: { estilo: state.style, formato: state.format, prompt_usuario: $('userPrompt').value },
        images: { base: state.base }
      };

      try {
        const res = await fetch(COFRE_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        
        if(data.status === 'success') {
          $('promptResult').innerText = data.prompt_used;
          openModal('ovPrompt');
          $('statusText').innerText = "Sucesso!";
        } else {
          // MOSTRA A MENSAGEM DO GOOGLE NA TUA CARA PARA SABERMOS O ERRO
          alert(data.message);
          $('statusText').innerText = "A API Recusou";
        }
      } catch (e) {
        alert("O Cofre não respondeu. O link do script pode estar errado.");
        $('statusText').innerText = "Cofre Offline";
      } finally {
        setTimeout(updateRun, 2000);
      }
    };

    $('copyBtn').onclick = () => {
      navigator.clipboard.writeText($('promptResult').innerText);
      alert('Copiado!');
    };

    window.onload = () => {
        const k = localStorage.getItem('afrodite_key');
        if(k) $('apiKey').value = k;
        updateRun();
    };
  </script>
</body>
</html>
